# 部署前先把键盘端产生的用户状态回拷到应用目录，避免重新部署重置。
rime:
  overrideDictFiles: false
  regexOnOverrideDictFiles:
    - "^.*[.]userdb.*$"
    - "^.*[.]txt$"
    - "^.*pantsu[.]user[.]dict[.]yaml$"
    - "^.*pantsu[.]zzc[.]dict[.]yaml$"
    - "^.*pantsu_overrides[.]tsv$"
    - "^.*pantsu_candidate_order[.]tsv$"
    - "^.*pantsu_self_words[.]tsv$"
    - "^.*pantsu_usage[.]tsv$"
    - "^.*pantsu_usage_events[.]tsv$"
    - "^.*pantsu_history[.]tsv$"
    - "^.*pantsu_performance[.]tsv$"
    - "^.*pantsu_performance[.]enabled$"
  regexOnCopyAppGroupDictFile:
    - "^.*[.]userdb.*$"
    - "^.*[.]txt$"
    - "^.*pantsu[.]user[.]dict[.]yaml$"
    - "^.*pantsu[.]zzc[.]dict[.]yaml$"
    - "^.*pantsu_overrides[.]tsv$"
    - "^.*pantsu_candidate_order[.]tsv$"
    - "^.*pantsu_self_words[.]tsv$"
    - "^.*pantsu_usage[.]tsv$"
    - "^.*pantsu_usage_events[.]tsv$"
    - "^.*pantsu_history[.]tsv$"
    - "^.*pantsu_performance[.]tsv$"
    - "^.*pantsu_performance[.]enabled$"

